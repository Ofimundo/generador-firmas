<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light dark">
<title>Firma Dreamtec</title>
<style>
/* Solo para previsualizar en navegador: Gmail/Outlook ignoran esto sin romper la firma */
.qr-btn img{transition:transform .18s ease,box-shadow .18s ease;}
.qr-btn:hover img{transform:translateY(-2px);box-shadow:0 4px 10px rgba(17,24,32,.15);}
</style>
</head>
<body style="margin:0;padding:24px;background:#f5f6f7;">
<!-- FIRMA: selecciona desde aquí hasta el final de la tabla, copia (Ctrl/Cmd+C) y pega en Gmail → Configuración → Firma, o en Outlook → Firmas. -->
<!-- IMPORTANTE: antes de usarla, sube los archivos de assets/ (GIF, logo Ofimundo y los 2 QR png) a tu sitio (ej: https://www.dreamtec.cl/firma/) y reemplaza las rutas "assets/..." por las URLs https completas. -->
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="width:600px;max-width:600px;background:#ffffff;border:1px solid #e8ebee;border-radius:8px;border-collapse:separate;overflow:hidden;font-family:Calibri,'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif;">
  <tr>
    <td style="padding:16px 26px 14px 26px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <!-- Logo animado -->
          <td width="140" valign="middle" style="width:140px;">
            <a href="https://www.dreamtec.cl" style="text-decoration:none;">
              <img src="https://d3d57fbyf4vdnc.cloudfront.net/firma_dreamtec/02-elementos/dreamtec-logo-animado.gif" alt="Dreamtec" width="135" style="display:block;width:135px;height:auto;border:0;">
            </a>
          </td>
          <!-- Hairline -->
          <td width="1" bgcolor="#00BED5" style="width:1px;background:#00BED5;font-size:0;line-height:0;">&nbsp;</td>
          <!-- Datos -->
          <td valign="middle" style="padding:0 18px 0 20px;">
            <div style="font-size:25px;line-height:24px;font-weight:bold;color:#000000;mso-line-height-rule:exactly;">{{nombre_empleado}}</div>
            <div style="font-size:16px;line-height:17px;font-weight:bold;color:#00BED5;mso-line-height-rule:exactly;">{{cargo_empleado}}</div>
            <div style="font-size:14px;line-height:18px;color:#000000;padding-top:7px;mso-line-height-rule:exactly;">
              <a href="tel:+{{celular_empleado}}" style="color:#000000;text-decoration:none;">+{{celular_empleado}}</a><br>
              <a href="mailto:{{correo_empleado}}" style="color:#000000;text-decoration:none;">{{correo_empleado}}</a><br>
              <a href="https://www.dreamtec.cl" style="color:#00BED5;font-weight:bold;text-decoration:none;">www.dreamtec.cl</a>
            </div>
          </td>
          <!-- QRs -->
          <td width="150" valign="middle" style="width:150px;border-left:1px solid #eceff2;padding-left:16px;">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td align="center" style="padding-right:10px;">
                  <a class="qr-btn" href="https://wa.me/{{celular_empleado}}" style="text-decoration:none;">
                    <img src="{{qr_wsp}}" alt="QR WhatsApp" width="56" height="56" style="display:block;border:1px solid #e4e9ee;border-radius:8px;padding:3px;">
                    <span style="display:block;font-size:8px;letter-spacing:1px;color:#8a94a0;padding-top:4px;text-align:center;">WHATSAPP</span>
                  </a>
                </td>
                <td align="center">
                  <a class="qr-btn" href="https://www.linkedin.com/in/enrique-caballero-850464192/" style="text-decoration:none;">
                    <img src="{{qr_linkedin}}" alt="QR LinkedIn" width="56" height="56" style="display:block;border:1px solid #e4e9ee;border-radius:8px;padding:3px;">
                    <span style="display:block;font-size:8px;letter-spacing:1px;color:#8a94a0;padding-top:4px;text-align:center;">LINKEDIN</span>
                  </a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
  <!-- Franja del grupo -->
  <tr>
    <td bgcolor="#00BED5" style="background:#00BED5;background-image:linear-gradient(90deg,#008EA0,#00BED5 30%,#2B2A5C 65%,#8F1E7B 100%);padding:8px 26px;">
      <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%">
        <tr>
          <td style="font-size:9.5px;letter-spacing:1.1px;font-weight:bold;color:#ffffff;white-space:nowrap;">DREAMTEC &middot; PARTE DEL GRUPO OFIMUNDO &middot; 40 A&Ntilde;OS IMPULSANDO EL CAMBIO</td>
          <td align="right">
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" align="right">
              <tr>
                <td style="padding:4px 0;">
                  <a href="https://www.ofimundo.cl" style="text-decoration:none;"><img src="https://d3d57fbyf4vdnc.cloudfront.net/firma_dreamtec/02-elementos/ofimundo-logo-blanco.png" alt="Ofimundo" width="90" style="display:block;width:90px;height:auto;border:0;"></a>
                </td>
              </tr>
            </table>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
