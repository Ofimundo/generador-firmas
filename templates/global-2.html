<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Firma Global Horizon</title>
</head>
<body style="margin: 0; padding: 0; font-family: Arial, sans-serif;">

<!-- Contenedor principal de la firma -->
<table border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse;">
    
    <!-- Ornamento Superior -->
    <tr>
        <td style="padding: 0; margin: 0; line-height: 0; font-size: 0;">
            <img src="https://d3d57fbyf4vdnc.cloudfront.net/firma_global/01-elementos/ornamento-superior.png" width="600" height="auto" style="display: block; border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic;">
        </td>
    </tr>
    
    <!-- Contenedor medio con fondo -->
    <tr>
        <td style="position: relative; padding: 0; margin: 0; line-height: 0; font-size: 0;">
            <!-- Imagen de fondo2 como base -->
            <table border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse; background-image: url('images-2/fondo2.png'); background-size: 600px auto; background-repeat: no-repeat;">
                <tr>
                    <td style="padding: 0; margin: 0;">
                        
                        <!-- Tabla interna para foto y datos -->
                        <table border="0" cellpadding="0" cellspacing="0" width="600" style="border-collapse: collapse;">
                            <tr>
                                <!-- Columna izquierda: Foto-perfil-logo (sin recortar) -->
                                <td width="220" valign="bottom" style="padding: 20px 0 20px 20px; line-height: 0; font-size: 0;">
                                    <img src="{{foto_empleado2}}"
                                        alt="foto_perfil" 
                                        width="200" 
                                        height="auto" 
                                        style="display: block; border: 0; outline: none; text-decoration: none; max-width: 200px;">
                                </td>
                                
                                <!-- Columna derecha: Datos -->
                                <td width="380" valign="middle" style="padding: 20px 20px 20px 10px;">
                                    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="border-collapse: collapse; font-family: Arial, sans-serif;">

                                        <tr>
                                            <td colspan="2">
                                                <h1 style="margin: 0 0 30px 0; font-size: 32px; font-weight: bold; color: #0d9488; letter-spacing: 1px;">{{nombre_empleado}}</h1>
                                                <p style="margin: 0 0 30px 0; font-size: 22px; color: #374151; font-weight: normal;">{{cargo_empleado}}</p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td colspan="2">
                                                <p style="margin: 0 0 3px 0; font-size: 16px; color: #1f2937; line-height: 1.2;">
                                                    <strong style="color: #0d9488;">Celular:</strong> +{{celular_empleado}}
                                                </p>
                                                <p style="margin: 0 0 25px 0; font-size: 16px; color: #1f2937; line-height: 1.2;">
                                                    <strong style="color: #0d9488;">Correo: {{correo_empleado}}</strong>
                                                </p>
                                            </td>
                                        </tr>
                                        <tr>
                                            <td colspan="2">
                                                <p style="margin: 0 0 3px 0; font-size: 16px; color: #374151; line-height: 1.2;">Lota 2305, Providencia, RM</p>
                                                <p style="margin: 0 0 0px 0; font-size: 16px; line-height: 1.2;">
                                                    <a href="https://globalhorizonlatam.com/" style="color: #0d9488; text-decoration: none; font-weight: bold;">www.globalhorizonlatam.com</a>
                                                </p>
                                            </td>
                                        </tr>

                                    </table>
                                </td>
                            </tr>
                        </table>
                        
                    </td>
                </tr>
            </table>
        </td>
    </tr>
    
    <!-- Ornamento Inferior -->
    <tr>
        <td style="padding: 0; margin: 0; line-height: 0; font-size: 0;">
            <img src="https://d3d57fbyf4vdnc.cloudfront.net/firma_global/01-elementos/ornamento-inferior.png" width="600" height="auto" style="display: block; border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic;">
        </td>
    </tr>
    
</table>

</body>
</html>
